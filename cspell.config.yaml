# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
# English (US) is built in; Portuguese (Portugal) comes from @cspell/dict-pt-pt.
language: en-US,pt-PT
import:
  - "@cspell/dict-pt-pt/cspell-ext.json"
useGitignore: true
ignorePaths:
  - pnpm-lock.yaml
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/.turbo/**"
  - "**/dist/**"
  - "**/storybook-static/**"
  - "**/coverage/**"
  - "**/*.svg"
  - "**/*.ico"
  - .husky/_/**
dictionaryDefinitions:
  - name: project-words
    path: ./project-words.txt
    addWords: true
dictionaries:
  - project-words
